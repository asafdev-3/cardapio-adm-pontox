<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin — Ponto X</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="./css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <img src="./assets/logo.png" class="login-logo" alt="Logo">
      <h1>Área Admin</h1>
      <p class="login-sub">Ponto X · Várzea da Palma</p>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="Digite seu PIN" autocomplete="off">
      <div id="pin-error" class="pin-error hidden">PIN incorreto. Tente novamente.</div>
      <button id="login-btn">Entrar</button>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="admin-screen" class="hidden">

    <header class="admin-header">
      <div class="admin-header-left">
        <img src="./assets/logo.png" class="admin-logo" alt="Logo">
        <div>
          <h1>Ponto X</h1>
          <p>Painel de gerenciamento</p>
        </div>
      </div>
      <button id="logout-btn">Sair</button>
    </header>

    <main class="admin-main">

      <section class="admin-card">
  <h2>Funcionamento</h2>

  <div class="form-grid">
    <input type="time" id="opening-time">
    <input type="time" id="closing-time">
  </div>

  <label style="display:flex;gap:10px;margin:15px 0;">
    <input type="checkbox" id="temporarily-closed">
    Fechado temporariamente
  </label>

  <input
    type="text"
    id="closure-message"
    placeholder="Mensagem para o cliente">

  <button id="save-hours-btn">
    Salvar funcionamento
  </button>
</section>

      <!-- FORM ADICIONAR/EDITAR -->
      <section class="admin-card">
        <h2 id="form-title">Adicionar item</h2>
        <div class="form-grid">
          <input id="item-name" type="text" placeholder="Nome do item">
          <input id="item-price" type="number" step="0.01" inputmode="decimal" placeholder="Preço (ex: 18.90)">
          <input id="item-category" type="text" placeholder="Categoria (ex: Lanches)">
          <input id="item-description" type="text" placeholder="Descrição (opcional)">
        </div>
        <div class="file-row">
          <label class="file-label">
            📷 Escolher foto
            <input id="item-image" type="file" accept="image/*">
          </label>
          <span id="file-name" class="file-name">Nenhuma foto selecionada</span>
        </div>
        <div class="form-actions">
          <button id="cancel-edit" class="btn-secondary hidden">Cancelar edição</button>
          <button id="save-item" class="btn-primary">Salvar item</button>
        </div>
        <div id="form-msg" class="form-msg hidden"></div>
      </section>

      <!-- LISTA DE ITENS -->
      <section class="admin-card">
        <h2>Itens cadastrados</h2>
        <div id="admin-list" class="admin-list">
          <p class="empty-msg">Carregando...</p>
        </div>
      </section>

    </main>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
