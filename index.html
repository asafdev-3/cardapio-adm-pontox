<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin — Tropical Açaí e Lanches</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="./css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <img id="admin-brand-logo-login" src="./assets/logo-tropical.svg" class="login-logo" alt="Logo Tropical Açaí e Lanches">
      <h1>Área Admin</h1>
      <p id="admin-brand-sub" class="login-sub">Tropical Açaí e Lanches · Várzea da Palma</p>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="Digite seu PIN" autocomplete="off">
      <div id="pin-error" class="pin-error hidden">PIN incorreto. Tente novamente.</div>
      <button id="login-btn">Entrar</button>
    </div>
  </div>

  <div id="admin-screen" class="hidden">
    <header class="admin-header">
      <div class="admin-header-left">
        <img id="admin-brand-logo-header" src="./assets/logo-tropical.svg" class="admin-logo" alt="Logo Tropical Açaí e Lanches">
        <div>
          <h1 id="admin-brand-name">Tropical Açaí e Lanches</h1>
          <p>Painel de gerenciamento</p>
        </div>
      </div>
      <button id="logout-btn">Sair</button>
    </header>

    <main class="admin-main">
      <section class="admin-card">
        <h2>Funcionamento</h2>
        <div class="form-grid">
          <div class="field">
            <label>Abertura</label>
            <input type="time" id="opening-time">
          </div>
          <div class="field">
            <label>Fechamento</label>
            <input type="time" id="closing-time">
          </div>
        </div>
        <label class="switch-row">
          <input type="checkbox" id="temporarily-closed">
          <span>Fechado temporariamente</span>
        </label>
        <textarea id="closure-message" rows="3" placeholder="Ex.: Hoje não abriremos devido à falta de energia."></textarea>
        <button id="save-hours-btn" class="btn-primary">Salvar funcionamento</button>
      </section>

      <section class="admin-card">
        <h2 id="form-title">Adicionar item</h2>
        <div class="form-grid">
          <input id="item-name" type="text" placeholder="Nome do item">
          <input id="item-price" type="number" step="0.01" inputmode="decimal" placeholder="Preço (ex: 18.90)">
          <input id="item-category" type="text" placeholder="Categoria (ex: Açaí, Lanches, Sorvetes)">
          <input id="item-description" type="text" placeholder="Descrição (opcional)">
        </div>
        <div class="file-row">
          <label class="file-label">📷 Escolher foto<input id="item-image" type="file" accept="image/*"></label>
          <span id="file-name" class="file-name">Nenhuma foto selecionada</span>
        </div>
        <div class="form-actions">
          <button id="cancel-edit" class="btn-secondary hidden">Cancelar edição</button>
          <button id="save-item" class="btn-primary">Salvar item</button>
        </div>
        <div id="form-msg" class="form-msg hidden"></div>
      </section>

      <section class="admin-card">
        <h2>Itens cadastrados</h2>
        <div id="admin-list" class="admin-list"><p class="empty-msg">Carregando...</p></div>
      </section>
    </main>
  </div>

  <script>
    const adminDemo = new URLSearchParams(location.search).get('demo');
    if (adminDemo === 'bobs') {
      document.title = "Admin — Bob's Burgue";
      document.getElementById('admin-brand-logo-login').src = './assets/logo-dr-espeto.svg';
      document.getElementById('admin-brand-logo-header').src = './assets/logo-dr-espeto.svg';
      document.getElementById('admin-brand-sub').textContent = "Bob's Burgue · Várzea da Palma";
      document.getElementById('admin-brand-name').textContent = "Bob's Burgue";
      document.getElementById('item-category').placeholder = 'Categoria (ex: Hambúrgueres)';
    } else {
      document.documentElement.style.setProperty('--yellow', '#F5C542');
      document.documentElement.style.setProperty('--red', '#7B1FA2');
    }
  </script>

  <script src="./js/config.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
